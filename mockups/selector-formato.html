<meta charset="utf-8">
<title>Selector de formato</title>
<style>
  /* Three phones, each with the same video and a different way to pick what to save. */
  :root {
    --bg: #eef0f4;
    --fg: #1b1e26;
    --muted: #5d6475;
    --rule: #d5d9e2;
    --accent: #6f63e8;
    --control: #ffffff;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    --round: ui-rounded, "SF Pro Rounded", -apple-system, "Segoe UI", sans-serif;
    /* Phones keep the app's dark theme. */
    --ph-bg: #111319;
    --ph-fg: #f4f5f8;
    --ph-muted: #8b90a0;
    --ph-rule: #262a33;
    --ph-field: #23262f;
    --ph-accent: #8c80ff;
    --ph-accent-soft: rgba(140, 128, 255, .18);
    --ph-accent-ink: #14121f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0b0c10; --fg: #e9ebf0; --muted: #959bab; --rule: #262a33; --accent: #9a90ff; --control: #1a1d24; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #0b0c10; --fg: #e9ebf0; --muted: #959bab; --rule: #262a33; --accent: #9a90ff; --control: #1a1d24; color-scheme: dark; }

  body { background: var(--bg); color: var(--fg); font-family: var(--font); padding: 24px 16px 40px; }
  .page { max-width: 1180px; margin: 0 auto; display: grid; gap: 22px; }
  header h1 { font: 700 26px/1.15 var(--round); margin: 0; }
  header p { margin: 6px 0 0; color: var(--muted); font-size: 15px; max-width: 62ch; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .controls span { color: var(--muted); font-size: 14px; margin-right: 4px; }
  .controls button { font: 600 14px var(--font); padding: 7px 13px; border-radius: 999px; border: 1px solid var(--rule); background: var(--control); color: var(--fg); cursor: pointer; }
  .controls button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .controls button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .phones { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 28px; justify-items: center; }
  figure { margin: 0; display: grid; gap: 10px; justify-items: center; width: 100%; max-width: 360px; }
  figcaption { text-align: center; }
  figcaption b { display: block; font: 700 17px var(--round); }
  figcaption span { color: var(--muted); font-size: 13.5px; }

  .phone { position: relative; width: 100%; max-width: 360px; aspect-ratio: 360 / 700; border-radius: 44px; overflow: hidden; background: var(--ph-bg); color: var(--ph-fg); box-shadow: 0 0 0 9px #050608, 0 18px 40px rgba(0,0,0,.28); isolation: isolate; }
  .glow { position: absolute; width: 420px; height: 380px; left: -110px; top: -200px; border-radius: 50%; background: #c0443a; filter: blur(90px); opacity: .42; z-index: 0; }
  .ui { position: absolute; inset: 0; z-index: 1; padding: 0 18px; display: flex; flex-direction: column; gap: 14px; }
  .status { height: 44px; display: flex; align-items: center; justify-content: space-between; font: 600 15px var(--font); padding: 6px 10px 0; }
  .status i { font-style: normal; font-size: 12px; }
  .nav { display: grid; grid-template-columns: 42px 1fr 42px; align-items: center; }
  .nav h2 { margin: 0; text-align: center; font: 600 17px var(--font); }
  .round { width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); display: grid; place-items: center; }
  .thumb { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background:
      radial-gradient(circle at 70% 38%, #ffd27a 0 7%, transparent 7.5%),
      linear-gradient(180deg, transparent 58%, #2c1d3b 58% 64%, #1a1328 64%),
      linear-gradient(180deg, #ff8a5c, #c94b6d 45%, #5b2c6f 70%); }
  .thumb time { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.6); color: #fff; font-size: 11.5px; padding: 2px 6px; border-radius: 6px; }
  .meta h3 { margin: 0; font: 600 16.5px/1.25 var(--font); }
  .meta p { margin: 3px 0 0; color: var(--ph-muted); font-size: 13.5px; }

  .row { display: flex; justify-content: space-between; align-items: center; min-height: 40px; padding: 0 4px; font-size: 15px; }
  .row .menu { color: var(--ph-accent); display: flex; gap: 4px; align-items: center; }
  .row .menu::after { content: "⌃⌄"; font-size: 10px; letter-spacing: -2px; writing-mode: vertical-lr; opacity: .9; }
  .divider { height: 1px; background: var(--ph-rule); margin: 0 4px; }

  .bar { position: absolute; left: 50%; transform: translateX(-50%); bottom: 24px; height: 50px; width: 240px; border-radius: 999px; z-index: 3; background: var(--ph-accent); color: var(--ph-accent-ink); display: flex; align-items: center; justify-content: center; gap: 8px; font: 600 16.5px var(--font); border: 0; }
  svg.i { width: 20px; height: 20px; flex: none; }

  /* A: icon choices with what each one saves, no boxes. */
  .choices { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
  .choice { all: unset; cursor: pointer; display: grid; justify-items: center; gap: 5px; padding: 10px 4px 8px; border-radius: 16px; transition: background .25s, color .25s; color: var(--ph-muted); }
  .choice .ic { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.06); transition: background .25s, transform .35s cubic-bezier(.3,1.6,.5,1); }
  .choice b { font-size: 14px; font-weight: 600; color: var(--ph-fg); }
  .choice small { font-size: 11.5px; }
  .choice[aria-checked="true"] .ic { background: var(--ph-accent); color: var(--ph-accent-ink); transform: scale(1.06); }
  .choice[aria-checked="true"] b { color: var(--ph-accent); }
  .choice:focus-visible { outline: 2px solid var(--ph-accent); }

  /* B: text tabs with an underline that slides. */
  .tabs { position: relative; display: flex; gap: 22px; padding: 0 4px; border-bottom: 1px solid var(--ph-rule); }
  .tab { all: unset; cursor: pointer; display: flex; gap: 6px; align-items: center; padding: 8px 0 10px; font-size: 16px; font-weight: 600; color: var(--ph-muted); transition: color .2s; }
  .tab[aria-selected="true"] { color: var(--ph-fg); }
  .tab:focus-visible { outline: 2px solid var(--ph-accent); }
  .tabs .ink { position: absolute; bottom: -1px; height: 3px; border-radius: 3px; background: var(--ph-accent); transition: left .38s cubic-bezier(.3,1.3,.5,1), width .38s cubic-bezier(.3,1.3,.5,1); }

  /* C: the format lives in the download button. */
  .split { position: absolute; left: 50%; transform: translateX(-50%); bottom: 24px; display: flex; gap: 8px; z-index: 3; }
  .split .fmt { all: unset; cursor: pointer; height: 50px; padding: 0 14px 0 12px; border-radius: 999px; background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); display: flex; gap: 7px; align-items: center; font: 600 15px var(--font); backdrop-filter: blur(12px); }
  .split .fmt::after { content: "⌃⌄"; font-size: 9px; letter-spacing: -2px; writing-mode: vertical-lr; color: var(--ph-muted); }
  .split .go { all: unset; cursor: pointer; height: 50px; padding: 0 22px; border-radius: 999px; background: var(--ph-accent); color: var(--ph-accent-ink); display: flex; gap: 8px; align-items: center; font: 600 16px var(--font); }
  .split button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .pop { position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%) scale(.92); transform-origin: 30% 100%; opacity: 0; pointer-events: none; z-index: 4; width: 230px; border-radius: 22px; background: rgba(44,47,58,.96); box-shadow: 0 18px 40px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.08); padding: 6px; transition: opacity .18s, transform .28s cubic-bezier(.3,1.4,.5,1); }
  .pop.open { opacity: 1; transform: translateX(-50%) scale(1); pointer-events: auto; }
  .pop button { all: unset; cursor: pointer; display: flex; gap: 10px; align-items: center; width: calc(100% - 24px); padding: 10px 12px; border-radius: 14px; font-size: 15px; }
  .pop button small { margin-left: auto; color: var(--ph-muted); font-size: 12.5px; }
  .pop button[aria-checked="true"] { background: rgba(255,255,255,.08); }
  .pop button:focus-visible { outline: 2px solid var(--ph-accent); }
  .pop hr { border: 0; height: 1px; background: rgba(255,255,255,.08); margin: 4px 8px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="page">
  <header>
    <h1>Selector de formato</h1>
    <p>Tres reemplazos para el control segmentado de Video y Audio. Toca las opciones dentro de cada teléfono. Abajo puedes cambiar el contenido analizado para ver cómo se comportan con más formatos.</p>
  </header>
  <div class="controls" role="group" aria-label="Contenido de ejemplo">
    <span>Contenido:</span>
    <button type="button" data-set="video" aria-pressed="true">Video de YouTube</button>
    <button type="button" data-set="post" aria-pressed="false">Publicación con foto y video</button>
  </div>
  <div class="phones">
    <figure><div class="phone" data-variant="choices"></div><figcaption><b>A · Iconos</b><span>Cada formato es un ícono redondo con lo que guarda debajo. Sin recuadros; el elegido se llena con el color de la app.</span></figcaption></figure>
    <figure><div class="phone" data-variant="tabs"></div><figcaption><b>B · Pestañas</b><span>Texto con ícono y una línea que se desliza bajo el elegido, como las pestañas de Fotos.</span></figcaption></figure>
    <figure><div class="phone" data-variant="split"></div><figcaption><b>C · En el botón</b><span>El formato vive junto a Descargar: un toque abre el menú con formato y calidad. La pantalla queda solo con el video.</span></figcaption></figure>
  </div>
</div>

<script>
(() => {
  const ICONS = {
    video: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 9h18M3 15h18M8 5v4M16 5v4M8 15v4M16 15v4"/></svg>',
    audio: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>',
    image: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>',
    thumbnail: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="3" width="15" height="12" rx="2.5"/><path d="M3 8v10a3 3 0 0 0 3 3h10"/></svg>',
  };
  const LABEL = { video: 'Video', audio: 'Audio', image: 'Foto', thumbnail: 'Miniatura' };
  const SETS = {
    video: { title: 'Atardecer en Paracas · timelapse 4K', by: 'Viajes del Sur · 4:12', modes: ['video', 'audio', 'thumbnail'], detail: { video: '1080p · MP4', audio: 'M4A', thumbnail: 'JPG' } },
    post: { title: 'Ruta al nevado Pastoruri', by: 'Instagram · @andesperu', modes: ['video', 'image'], detail: { video: '720p · MP4', image: 'JPG' } },
  };
  const QUALITIES = ['1080p', '720p', '480p', '360p'];
  let set = 'video';
  const state = new Map();

  const shell = (variant) => `<div class="glow"></div><div class="ui">
    <div class="status"><span>3:59</span><i>●●● ᯤ 100%</i></div>
    <div class="nav"><div class="round"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M15 5l-7 7 7 7"/></svg></div><h2>Downloader</h2><span></span></div>
    <div class="thumb"><time>4:12</time></div>
    <div class="meta"><h3></h3><p></p></div>
    <div class="picker"></div>
    <div class="options"></div>
  </div>
  ${variant === 'split' ? '<div class="pop" role="menu"></div><div class="split"><button class="fmt" type="button" aria-haspopup="menu"></button><button class="go" type="button">↓ Descargar</button></div>' : '<button class="bar" type="button">↓ Descargar</button>'}`;

  function render(phone) {
    const variant = phone.dataset.variant;
    const data = SETS[set];
    const s = state.get(phone);
    if (!data.modes.includes(s.mode)) s.mode = data.modes[0];
    phone.querySelector('.meta h3').textContent = data.title;
    phone.querySelector('.meta p').textContent = data.by;
    const picker = phone.querySelector('.picker');
    const options = phone.querySelector('.options');
    const qualityRow = s.mode === 'video' ? `<div class="row"><span>Calidad</span><span class="menu">${s.quality}</span></div>` : '';

    if (variant === 'choices') {
      picker.innerHTML = `<div class="choices" role="radiogroup" aria-label="Formato">${data.modes.map((m) => `<button class="choice" role="radio" aria-checked="${m === s.mode}" data-mode="${m}"><span class="ic">${ICONS[m]}</span><b>${LABEL[m]}</b><small>${data.detail[m]}</small></button>`).join('')}</div>`;
      options.innerHTML = qualityRow;
    } else if (variant === 'tabs') {
      picker.innerHTML = `<div class="tabs" role="tablist" aria-label="Formato">${data.modes.map((m) => `<button class="tab" role="tab" aria-selected="${m === s.mode}" data-mode="${m}">${ICONS[m]}${LABEL[m]}</button>`).join('')}<span class="ink"></span></div>`;
      options.innerHTML = qualityRow;
      requestAnimationFrame(() => placeInk(phone, true));
    } else {
      picker.innerHTML = '';
      options.innerHTML = '';
      const fmt = phone.querySelector('.fmt');
      fmt.innerHTML = `${ICONS[s.mode]}${s.mode === 'video' ? s.quality : LABEL[s.mode]}`;
      fmt.setAttribute('aria-label', `Formato: ${LABEL[s.mode]}`);
      phone.querySelector('.go').innerHTML = `↓ Descargar`;
      const pop = phone.querySelector('.pop');
      const videoRows = data.modes.includes('video') ? QUALITIES.map((q) => `<button role="menuitemradio" aria-checked="${s.mode === 'video' && s.quality === q}" data-mode="video" data-quality="${q}">${ICONS.video}Video<small>${q}</small></button>`).join('') : '';
      const others = data.modes.filter((m) => m !== 'video').map((m) => `<button role="menuitemradio" aria-checked="${s.mode === m}" data-mode="${m}">${ICONS[m]}${LABEL[m]}<small>${data.detail[m]}</small></button>`).join('');
      pop.innerHTML = videoRows + (videoRows && others ? '<hr>' : '') + others;
    }
  }

  function placeInk(phone, instant) {
    const tabs = phone.querySelector('.tabs');
    if (!tabs) return;
    const on = tabs.querySelector('[aria-selected="true"]');
    const ink = tabs.querySelector('.ink');
    if (instant) ink.style.transition = 'none';
    ink.style.left = `${on.offsetLeft}px`;
    ink.style.width = `${on.offsetWidth}px`;
    if (instant) requestAnimationFrame(() => { ink.style.transition = ''; });
  }

  document.querySelectorAll('.phone').forEach((phone) => {
    phone.innerHTML = shell(phone.dataset.variant);
    state.set(phone, { mode: 'video', quality: '1080p' });
    render(phone);
    phone.addEventListener('click', (event) => {
      const s = state.get(phone);
      const variant = phone.dataset.variant;
      const pick = event.target.closest('[data-mode]');
      if (variant === 'split') {
        const pop = phone.querySelector('.pop');
        if (event.target.closest('.fmt')) { pop.classList.toggle('open'); return; }
        if (pick) { s.mode = pick.dataset.mode; if (pick.dataset.quality) s.quality = pick.dataset.quality; render(phone); pop.classList.remove('open'); return; }
        pop.classList.remove('open');
        return;
      }
      if (!pick) return;
      s.mode = pick.dataset.mode;
      if (variant === 'tabs') {
        phone.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', String(t === pick)));
        placeInk(phone, false);
        phone.querySelector('.options').innerHTML = s.mode === 'video' ? `<div class="row"><span>Calidad</span><span class="menu">${s.quality}</span></div>` : '';
      } else {
        render(phone);
      }
    });
  });

  document.querySelectorAll('[data-set]').forEach((button) => button.addEventListener('click', () => {
    set = button.dataset.set;
    document.querySelectorAll('[data-set]').forEach((b) => b.setAttribute('aria-pressed', String(b === button)));
    document.querySelectorAll('.phone').forEach(render);
  }));
  addEventListener('resize', () => document.querySelectorAll('.phone').forEach((p) => placeInk(p, true)));
})();
</script>
