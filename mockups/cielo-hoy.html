<meta charset="utf-8">
<title>Cielo de Hoy</title>
<style>
  /* Three phones side by side (stacked on a phone), one shared clock under them. */
  :root {
    --bg: #eef0f4;
    --fg: #1b1e26;
    --muted: #5d6475;
    --rule: #d5d9e2;
    --accent: #c9822b;
    --control: #ffffff;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    --round: ui-rounded, "SF Pro Rounded", -apple-system, "Segoe UI", sans-serif;
    /* The phones are always the app's dark theme, as in the screenshots. */
    --ph-bg: #111319;
    --ph-fg: #f4f5f8;
    --ph-muted: #8b90a0;
    --ph-rule: #2a2e38;
    --ph-chip: #2a2213;
    --ph-ink: #f6bf63;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0b0c10; --fg: #e9ebf0; --muted: #959bab; --rule: #262a33; --accent: #e9a650; --control: #1a1d24; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #0b0c10; --fg: #e9ebf0; --muted: #959bab; --rule: #262a33; --accent: #e9a650; --control: #1a1d24; color-scheme: dark; }

  body { background: var(--bg); color: var(--fg); font-family: var(--font); padding: 24px 16px 40px; }
  .page { max-width: 1180px; margin: 0 auto; display: grid; gap: 22px; }
  header h1 { font: 700 26px/1.15 var(--round); margin: 0; letter-spacing: -0.01em; }
  header p { margin: 6px 0 0; color: var(--muted); font-size: 15px; max-width: 60ch; }

  .clock { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--bg); padding-block: 10px; }
  .clock output { font: 700 28px var(--round); font-variant-numeric: tabular-nums; min-width: 4.2ch; }
  .clock input { flex: 1 1 220px; accent-color: var(--accent); }
  .clock button { font: 600 15px var(--font); padding: 8px 14px; border-radius: 999px; border: 1px solid var(--rule); background: var(--control); color: var(--fg); cursor: pointer; }
  .clock button:focus-visible, .clock input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; }
  .presets button { padding: 6px 10px; font-size: 13px; }

  .phones { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 28px; justify-items: center; }
  figure { margin: 0; display: grid; gap: 10px; justify-items: center; width: 100%; max-width: 360px; }
  figcaption { text-align: center; }
  figcaption b { display: block; font: 700 17px var(--round); }
  figcaption span { color: var(--muted); font-size: 13.5px; }

  .phone { position: relative; width: 100%; max-width: 360px; aspect-ratio: 360 / 640; border-radius: 44px; overflow: hidden; background: var(--ph-bg); color: var(--ph-fg); box-shadow: 0 0 0 9px #050608, 0 18px 40px rgba(0,0,0,.28); font-family: var(--font); isolation: isolate; }
  .phone canvas.sky { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
  .ui { position: absolute; inset: 0; z-index: 1; padding: 0 22px; display: flex; flex-direction: column; }
  .status { height: 46px; display: flex; align-items: center; justify-content: space-between; font: 600 15px var(--font); padding: 6px 12px 0; }
  .status i { font-style: normal; font-size: 12px; opacity: .9; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; margin-top: 12px; }
  .top h2 { font: 800 34px/1 var(--font); margin: 0; letter-spacing: -0.02em; }
  .top small { display: block; color: var(--ph-muted); font-size: 14.5px; margin-top: 6px; }
  .glass { width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); display: grid; place-items: center; backdrop-filter: blur(10px); }
  .glass svg { width: 20px; height: 20px; }
  .slot { position: relative; }
  .hero { margin-top: 26px; }
  .hero .kicker { color: var(--ph-ink); font-weight: 700; font-size: 14.5px; }
  .hero h3 { color: var(--ph-ink); font: 800 23px/1.15 var(--font); margin: 6px 0 4px; letter-spacing: -0.01em; }
  .hero p { color: var(--ph-muted); margin: 0; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .hero .big { display: flex; align-items: baseline; gap: 8px; margin-top: 12px; }
  .hero .big b { font: 900 38px var(--round); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .hero .big span { color: var(--ph-muted); font-size: 14px; }
  .week { margin-top: 26px; }
  .week .row { display: flex; justify-content: space-between; align-items: baseline; }
  .week h4 { margin: 0; font: 700 18px var(--font); }
  .week .row span { color: var(--ph-muted); font-size: 13px; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); margin-top: 12px; text-align: center; }
  .days div { padding: 7px 0; border-radius: 12px; display: grid; gap: 4px; }
  .days div em { font-style: normal; color: var(--ph-muted); font-size: 11px; font-weight: 700; }
  .days div b { font-size: 18px; }
  .days .today { background: var(--ph-chip); }
  .days .today em, .days .today b { color: var(--ph-ink); }
  .tabbar { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); width: 72%; height: 54px; border-radius: 999px; background: rgba(40,43,52,.85); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); display: flex; justify-content: space-around; align-items: center; font-size: 10.5px; color: #d6d8df; z-index: 2; }
  .tabbar span:first-child { color: #a99cff; }

  /* B: the day as a line under the date. */
  .dayline { position: relative; height: 34px; margin-top: 14px; }
  .dayline .track { position: absolute; left: 0; right: 0; top: 15px; height: 4px; border-radius: 2px; background: var(--ph-rule); }
  .dayline .block { position: absolute; top: 13px; height: 8px; border-radius: 4px; }
  .dayline .ticks { position: absolute; left: 0; right: 0; top: 24px; display: flex; justify-content: space-between; color: var(--ph-muted); font-size: 10px; font-variant-numeric: tabular-nums; }
  .dayline .now { position: absolute; top: 4px; width: 26px; height: 26px; margin-left: -13px; transition: left .25s ease; }

  @media (prefers-reduced-motion: reduce) { .dayline .now { transition: none; } }
</style>

<div class="page">
  <header>
    <h1>Cielo de Hoy</h1>
    <p>Tres maneras de llevar la hora del día a la pantalla Hoy sin el arco suelto. Mueve la hora o dale a reproducir para ver el día completo.</p>
  </header>

  <div class="clock">
    <output id="clockOut">12:26</output>
    <input id="clock" type="range" min="0" max="1439" value="746" aria-label="Hora del día">
    <button id="play" type="button">Reproducir día</button>
    <div class="presets">
      <button type="button" data-m="375">Amanecer</button>
      <button type="button" data-m="746">Mediodía</button>
      <button type="button" data-m="1105">Atardecer</button>
      <button type="button" data-m="1350">Noche</button>
    </div>
  </div>

  <div class="phones">
    <figure>
      <div class="phone" data-variant="ambient"></div>
      <figcaption><b>A · Luz de fondo</b><span>El cielo es el brillo detrás del título: cambia de color con la hora y el sol se asoma por arriba.</span></figcaption>
    </figure>
    <figure>
      <div class="phone" data-variant="line"></div>
      <figcaption><b>B · Línea del día</b><span>Una línea de 6:00 a 23:00 bajo la fecha con tus clases en su color y el sol marcando la hora.</span></figcaption>
    </figure>
    <figure>
      <div class="phone" data-variant="horizon"></div>
      <figcaption><b>C · Horizonte</b><span>Una curva amplia que se pierde en los bordes, detrás de la fecha, sin línea de base.</span></figcaption>
    </figure>
  </div>
</div>

<template id="phoneUi">
  <canvas class="sky"></canvas>
  <div class="ui">
    <div class="status"><span class="t">12:26</span><i>●●● ᯤ 51%</i></div>
    <div class="top">
      <div><h2>Hoy</h2><small>Miércoles, 14 de octubre</small></div>
      <div class="glass"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg></div>
    </div>
    <div class="slot"></div>
    <div class="hero">
      <div class="kicker">Siguiente</div>
      <h3>Gestion de la Información</h3>
      <p>SI130 U · PRA · 4:00 PM – 6:00 PM · S4-203</p>
      <div class="big"><b class="left">3 h 35 min</b><span>para empezar</span></div>
    </div>
    <div class="week">
      <div class="row"><h4>Semana</h4><span>7 cursos</span></div>
      <div class="days">
        <div><em>L</em><b>2</b></div><div><em>M</em><b>3</b></div><div class="today"><em>X</em><b>1</b></div><div><em>J</em><b>2</b></div><div><em>V</em><b>2</b></div><div><em>S</em><b>–</b></div><div><em>D</em><b>–</b></div>
      </div>
    </div>
  </div>
  <div class="tabbar"><span>⌂ Inicio</span><span>▦ Miniapps</span><span>⚙ Ajustes</span></div>
</template>

<script>
(() => {
  const SUNRISE = 360, SUNSET = 1110;
  // Today's classes for the line (B): one finished this morning, the one coming up.
  const CLASSES = [
    { start: 480, end: 600, color: '#5e9cf5' },
    { start: 960, end: 1080, color: '#f6bf63' },
  ];
  // Sky colour through the day: [minute, glow, horizon].
  const KEYS = [
    [0, '#1b2a6b', '#0d1330'], [300, '#1f2a66', '#141a3c'], [360, '#e2765a', '#6b3f63'],
    [450, '#f0a35c', '#c9744e'], [720, '#f2b34f', '#e39a3f'], [1020, '#f08f3c', '#d9643c'],
    [1110, '#d9546f', '#7a3767'], [1190, '#4b3a86', '#22204f'], [1290, '#1b2a6b', '#0d1330'], [1440, '#1b2a6b', '#0d1330'],
  ];
  const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  function skyAt(m) {
    for (let i = 0; i < KEYS.length - 1; i++) {
      const [m0, g0, h0] = KEYS[i], [m1, g1, h1] = KEYS[i + 1];
      if (m >= m0 && m <= m1) {
        const t = (m - m0) / (m1 - m0);
        return { glow: mix(hex(g0), hex(g1), t), low: mix(hex(h0), hex(h1), t) };
      }
    }
    return { glow: hex('#1b2a6b'), low: hex('#0d1330') };
  }
  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  const isDay = (m) => m >= SUNRISE && m < SUNSET;
  const dayFraction = (m) => (m - SUNRISE) / (SUNSET - SUNRISE);
  const nightFraction = (m) => ((m >= SUNSET ? m - SUNSET : m + 1440 - SUNSET)) / (1440 - (SUNSET - SUNRISE));
  const clock = (m) => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(Math.floor(m % 60)).padStart(2, '0')}`;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const stars = Array.from({ length: 26 }, (_, i) => ({ x: (Math.sin(i * 12.9898) * 43758.5453 % 1 + 1) % 1, y: (Math.sin(i * 78.233) * 12345.678 % 1 + 1) % 1, s: i % 5 === 0 ? 1.6 : 1, p: i * 1.7 }));

  function drawSun(ctx, x, y, r, time, color) {
    const halo = ctx.createRadialGradient(x, y, r * 0.4, x, y, r * 3.2);
    halo.addColorStop(0, rgba(color, 0.55));
    halo.addColorStop(1, rgba(color, 0));
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(x, y, r * 3.2, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.translate(x, y); ctx.rotate(time * 0.12);
    ctx.fillStyle = rgba([255, 200, 90], 0.95);
    for (let i = 0; i < 8; i++) { ctx.rotate(Math.PI / 4); ctx.beginPath(); ctx.roundRect(-1.4, -r - 9, 2.8, 6, 1.4); ctx.fill(); }
    ctx.restore();
    ctx.fillStyle = '#ffb63a';
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  function drawMoon(ctx, x, y, r, bg) {
    const halo = ctx.createRadialGradient(x, y, r * 0.5, x, y, r * 3);
    halo.addColorStop(0, 'rgba(200,210,255,0.28)'); halo.addColorStop(1, 'rgba(200,210,255,0)');
    ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(x, y, r * 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e8ebf5'; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(x + r * 0.45, y - r * 0.3, r * 0.85, 0, Math.PI * 2); ctx.fill();
  }
  function drawStars(ctx, w, h, time, alpha) {
    for (const s of stars) {
      ctx.fillStyle = `rgba(235,240,255,${alpha * (0.35 + 0.4 * (0.5 + 0.5 * Math.sin(time * 1.3 + s.p)))})`;
      ctx.beginPath(); ctx.arc(s.x * w, s.y * h, s.s, 0, Math.PI * 2); ctx.fill();
    }
  }
  // How far into night: 0 by day, 1 deep night, eased around sunrise and sunset.
  function nightness(m) {
    const edge = 50;
    if (m >= SUNRISE + edge && m <= SUNSET - edge) return 0;
    if (m < SUNRISE - edge || m > SUNSET + edge) return 1;
    const d = m < 720 ? (SUNRISE + edge - m) / (edge * 2) : (m - (SUNSET - edge)) / (edge * 2);
    return Math.min(1, Math.max(0, d));
  }

  const painters = {
    // A: a wide soft glow from the top in the sky's colour; the sun or moon
    // sits low behind the title row, sliding left to right through the day.
    ambient(ctx, w, h, m, time) {
      const sky = skyAt(m), night = nightness(m);
      const along = isDay(m) ? dayFraction(m) : nightFraction(m);
      // Between the title and the calendar button, a little higher at noon.
      const x = w * (0.4 + 0.36 * along);
      const y = h * (0.135 - 0.025 * Math.sin(Math.PI * along));
      const g = ctx.createRadialGradient(x, y, 0, x, y, w * 0.95);
      g.addColorStop(0, rgba(sky.glow, 0.5 - 0.15 * night));
      g.addColorStop(0.45, rgba(sky.low, 0.22));
      g.addColorStop(1, rgba(sky.low, 0));
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      if (night > 0) drawStars(ctx, w, h * 0.32, time, night);
      ctx.globalAlpha = 0.9;
      isDay(m) ? drawSun(ctx, x, y, 11, time, sky.glow) : drawMoon(ctx, x, y, 10, '#161a2b');
      ctx.globalAlpha = 1;
    },
    // B: only the faint warm glow the app already has; the line lives in the DOM.
    line(ctx, w, h, m) {
      const sky = skyAt(m);
      const g = ctx.createRadialGradient(w * 0.2, -h * 0.05, 0, w * 0.2, -h * 0.05, w * 1.1);
      g.addColorStop(0, rgba(sky.glow, 0.32)); g.addColorStop(1, rgba(sky.low, 0));
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    },
    // C: a circle much wider than the screen, so only a gentle curve shows,
    // fading out at both edges. The sun rides it.
    horizon(ctx, w, h, m, time, band) {
      const sky = skyAt(m), night = nightness(m);
      // The curve lives in its own band between the date and the class.
      const r = w * 1.4, cx = w / 2, cy = band.top + 14 + r;
      const along = isDay(m) ? dayFraction(m) : nightFraction(m);
      const span = Math.acos(1 - (band.height - 22) / r); // reaches the band's foot at the edges
      const angle = -Math.PI / 2 - span + (0.08 + 0.84 * along) * span * 2;
      const g = ctx.createRadialGradient(cx, cy - r, 0, cx, cy - r, w * 0.9);
      g.addColorStop(0, rgba(sky.glow, 0.3 - 0.1 * night)); g.addColorStop(1, rgba(sky.low, 0));
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      if (night > 0) drawStars(ctx, w, band.top + band.height * 0.6, time, night * 0.8);
      const fade = ctx.createLinearGradient(0, 0, w, 0);
      fade.addColorStop(0, rgba(sky.glow, 0)); fade.addColorStop(0.25, rgba(sky.glow, 0.5));
      fade.addColorStop(0.75, rgba(sky.glow, 0.5)); fade.addColorStop(1, rgba(sky.glow, 0));
      ctx.strokeStyle = fade; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(cx, cy, r, -Math.PI / 2 - span - 0.2, -Math.PI / 2 + span + 0.2); ctx.stroke();
      const x = cx + r * Math.cos(angle), y = cy + r * Math.sin(angle);
      isDay(m) ? drawSun(ctx, x, y, 9, time, sky.glow) : drawMoon(ctx, x, y, 8, '#161a2b');
    },
  };

  const phones = [...document.querySelectorAll('.phone')].map((el) => {
    el.append(document.getElementById('phoneUi').content.cloneNode(true));
    const canvas = el.querySelector('canvas');
    const variant = el.dataset.variant;
    if (variant === 'line') {
      const line = document.createElement('div');
      line.className = 'dayline';
      line.innerHTML = '<div class="track"></div>' + CLASSES.map(() => '<div class="block"></div>').join('') +
        '<div class="ticks"><span>6</span><span>9</span><span>12</span><span>15</span><span>18</span><span>21</span><span>23</span></div><canvas class="now" width="52" height="52"></canvas>';
      el.querySelector('.slot').append(line);
    } else {
      el.querySelector('.slot').style.height = variant === 'horizon' ? '64px' : '0px';
    }
    return { el, canvas, ctx: canvas.getContext('2d'), variant };
  });

  const slider = document.getElementById('clock');
  const out = document.getElementById('clockOut');
  let minute = Number(slider.value), playing = false, last = performance.now();

  function hero(m) {
    const start = 960, end = 1080;
    const fmt = (d) => d >= 60 ? `${Math.floor(d / 60)} h ${d % 60} min` : `${d} min`;
    if (m < start) return [fmt(Math.round(start - m)), 'para empezar', 'Siguiente'];
    if (m < end) return [fmt(Math.round(end - m)), 'para terminar', 'En curso'];
    return ['Listo', 'por hoy', 'Clases terminadas'];
  }

  function frame(now) {
    const dt = (now - last) / 1000; last = now;
    if (playing) { minute = (minute + dt * 120) % 1440; slider.value = Math.floor(minute); }
    const time = reduced ? 0 : now / 1000;
    out.textContent = clock(minute);
    const [left, after, kicker] = hero(minute);
    for (const p of phones) {
      const rect = p.canvas.getBoundingClientRect();
      const dpr = devicePixelRatio || 1;
      if (p.canvas.width !== Math.round(rect.width * dpr)) { p.canvas.width = Math.round(rect.width * dpr); p.canvas.height = Math.round(rect.height * dpr); }
      const { ctx } = p;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, rect.width, rect.height);
      const slot = p.el.querySelector('.slot').getBoundingClientRect();
      painters[p.variant](ctx, rect.width, rect.height, minute, time, { top: slot.top - rect.top, height: slot.height });
      p.el.querySelector('.status .t').textContent = clock(minute);
      p.el.querySelector('.left').textContent = left;
      p.el.querySelector('.big span').textContent = after;
      p.el.querySelector('.kicker').textContent = kicker;
      if (p.variant === 'line') drawLine(p.el, minute, time);
    }
    requestAnimationFrame(frame);
  }

  // B's line runs 6:00–23:00.
  const L0 = 360, L1 = 1380;
  function drawLine(el, m, time) {
    const line = el.querySelector('.dayline');
    const width = line.clientWidth;
    const pos = (v) => `${((Math.min(L1, Math.max(L0, v)) - L0) / (L1 - L0)) * 100}%`;
    el.querySelectorAll('.dayline .block').forEach((b, i) => {
      const c = CLASSES[i];
      b.style.left = pos(c.start); b.style.width = `calc(${pos(c.end)} - ${pos(c.start)})`;
      b.style.background = c.end <= m ? '#4a4f5c' : c.color;
    });
    const now = line.querySelector('.now');
    now.style.left = pos(m);
    now.style.opacity = m < L0 || m > L1 ? 0.5 : 1;
    const ctx = now.getContext('2d');
    ctx.setTransform(2, 0, 0, 2, 0, 0); ctx.clearRect(0, 0, 26, 26);
    isDay(m) ? drawSun(ctx, 13, 13, 5, time, skyAt(m).glow) : drawMoon(ctx, 13, 13, 5.5, '#111319');
  }

  slider.addEventListener('input', () => { minute = Number(slider.value); });
  document.getElementById('play').addEventListener('click', (e) => {
    playing = !playing; e.currentTarget.textContent = playing ? 'Pausar' : 'Reproducir día';
  });
  document.querySelectorAll('.presets button').forEach((b) => b.addEventListener('click', () => { minute = Number(b.dataset.m); slider.value = minute; }));
  requestAnimationFrame(frame);
})();
</script>
